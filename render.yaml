databases:
  - name: unfold-db
    plan: free
services:
  - type: web
    name: unfold
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn --chdir backend config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: unfold-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
