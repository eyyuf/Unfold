databases:
  - name: unfold-db
    plan: free
services:
  - type: web
    name: unfold
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn --chdir backend config.wsgi:application
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: unfold-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: NODE_VERSION
        value: "22.22.0"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://unfold.onrender.com"
      - key: SITE_URL
        value: "https://unfold.onrender.com"
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
  - type: cron
    name: unfold-reminders
    runtime: python
    schedule: "0 * * * *"
    buildCommand: python -m pip install -r backend/requirements.txt
    startCommand: python backend/manage.py send_due_reminders
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: unfold-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SITE_URL
        value: "https://unfold.onrender.com"
